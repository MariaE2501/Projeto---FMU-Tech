<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bichinho Virtual</title>
     <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="titulo-container">
    <img src="Bichinho/placa.png" alt="" class="placa">
    <h1>Meu Bichinho Virtual</h1>
    </div>

    <div class="bichinho">
        <img src="inicio_img/corpo_cabeça.png" alt="corpo e cabeça" class="parte" id="corpo_cabeça">
        <img src="inicio_img/pata1.png" alt="pata1" class="parte">
        <img src="inicio_img/pata2.png" alt="pata2" class="pata2">

    </div>


     <!-- BARRA DE CARREGAMENTO -->
    <div class="carregamento">
        <div class="barra-progresso" id="progresso"></div>
    </div>

    <p class="texto-carregamento">Carregando...</p>

    <!-- SCRIPT DE CARREGAMENTO -->
    <script>
        let progresso = 0;

        let intervalo = setInterval(function() {
            progresso++;

            document.getElementById("progresso").style.width =
                progresso + "%";

            if (progresso >= 100) {
                clearInterval(intervalo);
                window.location.href = "jogo.html";
            }

        }, 50);
    </script>
</body>
</html>
